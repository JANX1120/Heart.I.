<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Garden of Roses 🌹</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="intro">
        <h1>A Garden of Roses</h1>
        <p>Touch anywhere and watch something beautiful grow...</p>
        <span>🌹</span>
    </div>

    <div id="rose-container"></div>

    
<div id="surprise-message">
    <div class="surprise-content">
        <div class="heart">❤️</div>
        <h1>10 Roses for You</h1>
        <p>
            Every rose I grow is a little reminder of you.
        </p>
        <span>You're something beautiful. 🌹</span>
        <button onclick="closeSurprise()">Keep Growing Roses</button>
    </div>
</div>


    <script src="script.js"></script>
</body>
</html>
